
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administração - Rifa PIX V2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      color: #333;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #174ea6;
      font-size: 24px;
    }

    .descricao {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .aviso {
      margin-top: 18px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 6px;
      color: #664d03;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🔐 Painel Administrativo</h1>

    <p class="descricao">
      Rifa PIX V2
    </p>

    <form id="formLogin">

      <div class="campo">
        <label for="emailAdmin">
          E-mail administrativo:
        </label>

        <input
          type="email"
          id="emailAdmin"
          placeholder="Digite seu e-mail"
          autocomplete="username"
          required
        >
      </div>

      <div class="campo">
        <label for="senhaAdmin">
          Senha:
        </label>

        <input
          type="password"
          id="senhaAdmin"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >
      </div>

     <button type="submit" id="btnLogin">
  Entrar no painel
</button>

<p id="mensagemLogin" role="status"></p>

    </form>

    <!-- ÁREA DA SESSÃO ADMINISTRATIVA -->
<div id="areaAdmin" hidden>
  <h3>Sessão administrativa ativa</h3>
  <p>Administrador autenticado com sucesso.</p>
  <button type="button" id="btnSair">Sair do painel</button>
</div>
    
    <div class="aviso">
      Área administrativa protegida.
      A autenticação será implementada na próxima etapa.
    </div>

  </main>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>

  <!-- CONFIGURAÇÃO FIREBASE -->
  <script src="firebase-config.js"></script>

  <script>

// IDENTIFICAÇÃO DO ADMINISTRADOR
const UID_ADMINISTRADOR = "VPBV5FULPPV9MORhxNprS89Fvg22";

// CRIAR INSTÂNCIA INDEPENDENTE
const adminApp = firebase.initializeApp(
  firebaseConfig,
  "adminApp"
);

// AUTENTICAÇÃO ADMINISTRATIVA
const adminAuth = adminApp.auth();

// ELEMENTOS DA TELA
const formLogin = document.getElementById("formLogin");
const mensagemLogin = document.getElementById("mensagemLogin");
const btnLogin = document.getElementById("btnLogin");

    // ELEMENTOS DA SESSÃO ADMINISTRATIVA
const areaAdmin = document.getElementById("areaAdmin");
const btnSair = document.getElementById("btnSair");
    
// REALIZAR LOGIN
formLogin.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email = document.getElementById("emailAdmin").value.trim();
  const senha = document.getElementById("senhaAdmin").value;

  btnLogin.disabled = true;
  mensagemLogin.textContent = "Verificando acesso...";

  try {

    const resultado = await adminAuth.signInWithEmailAndPassword(
      email,
      senha
    );

    // CONFERIR UID AUTORIZADO
    if (resultado.user.uid !== UID_ADMINISTRADOR) {

      await adminAuth.signOut();

      throw new Error("Esta conta não possui autorização administrativa.");
    }

    mensagemLogin.textContent = "Login administrativo confirmado!";

    console.log("Administrador autenticado!");
    console.log("UID administrativo:", resultado.user.uid);

  } catch (erro) {

    console.error("Erro no login:", erro.code || "", erro.message);

    mensagemLogin.textContent =
      erro.message || "Não foi possível realizar o login.";

  } finally {

    btnLogin.disabled = false;

  }

});

    // RESTAURAR E MONITORAR A SESSÃO ADMINISTRATIVA
adminAuth.onAuthStateChanged(async function(usuario) {

  if (usuario && usuario.uid === UID_ADMINISTRADOR) {
    formLogin.hidden = true;
    areaAdmin.hidden = false;

    console.log("Sessão administrativa restaurada.");

  } else {
    formLogin.hidden = false;
    areaAdmin.hidden = true;

    if (usuario) {
      await adminAuth.signOut();
      console.warn("Acesso não autorizado.");
    }
  }

});

// ENCERRAR SESSÃO ADMINISTRATIVA
btnSair.addEventListener("click", async function() {
  await adminAuth.signOut();
  mensagemLogin.textContent = "Sessão encerrada.";
});
    
</script>
  
</body>
</html>
